[package]
name = "blueos-recorder"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
chrono = "0.4.41"
clap = { version = "4.5.41", features = ["derive"] }
foxglove = "0.25.1"
include_dir = "0.7.4"
mcap = "0.25.0"
mavlink = { version = "0.18.0", default-features = false, features = ["std", "dialect-ardupilotmega"] }
mavlink-codec = { git = "https://github.com/joaoantoniocardoso/rust-mavlink-codec", rev = "577d04e1a60638b6ccab6729444cdb2e8201d8d8" }
once_cell = "1.19.0"
serde_json = "1.0.140"
serde_json5 = "0.2.1"
shellexpand = "3.1.0"
tokio = "1.46.0"
tokio-graceful-shutdown = "0.19.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zenoh = { version = "=1.9.0", features = ["shared-memory"] }

[profile.dev]
debug = 1
incremental = true

[profile.dev.package."*"]
opt-level = 0

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
panic = "unwind"

[profile.profiling]
inherits = "release"
debug = 1
strip = false
