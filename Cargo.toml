[package]
name = "blueos-recorder"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
bytes = "1.11"
chrono = "0.4.41"
clap = { version = "4.5.41", features = ["derive"] }
foxglove = "0.25.1"
include_dir = "0.7.4"
mcap = "0.25.0"
mavlink = { default-features = false, features = ["std", "ardupilotmega", "serde", "emit-extensions"], git = "https://github.com/mavlink/rust-mavlink", rev = "5f2ecbe856a02e7bd17f43de63c8136db7947715" }
mavlink-codec = { git = "https://github.com/bluerobotics/rust-mavlink-codec", rev = "cff00a38fe9575122488d081f6b70a8f5dabade9" }
once_cell = "1.19.0"
serde_json = "1.0.140"
serde_json5 = "0.2.1"
shellexpand = "3.1.0"
tokio = "1.46.0"
tokio-util = { version = "0.7", features = ["codec"] }
tokio-graceful-shutdown = "0.19.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zenoh = { version = "=1.9.0", features = ["shared-memory"] }
